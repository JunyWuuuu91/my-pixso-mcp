<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Pixso MCP</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #f1f5f9; }
      .wrap { padding: 14px; display: grid; gap: 10px; }
      h1 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex: none; }
      .dot.connecting { background: #f59e0b; }
      .dot.connected { background: #22c55e; }
      .dot.error { background: #ef4444; }
      label { display: grid; gap: 4px; color: #cbd5e1; font-size: 12px; }
      input { border: 1px solid #334155; background: #020617; color: #f1f5f9; border-radius: 8px; padding: 7px 8px; font-size: 13px; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; border: 0; border-radius: 8px; padding: 8px 10px; font-weight: 600; cursor: pointer; background: #2563eb; color: white; }
      .row button.secondary { background: #334155; color: #e2e8f0; }
      .status { padding: 8px 10px; border-radius: 8px; background: #1e293b; min-height: 38px; white-space: pre-wrap; word-break: break-word; font-size: 12px; }
      .log { max-height: 130px; overflow-y: auto; font-size: 11px; color: #94a3b8; display: grid; gap: 2px; }
      .log div { border-bottom: 1px solid #1e293b; padding: 2px 0; }
      .hint { color: #64748b; font-size: 11px; }
      code { color: #93c5fd; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><span id="dot" class="dot"></span> My Pixso MCP</h1>
      <div class="hint">Keep this window open while your AI agent calls MCP tools.</div>

      <label>
        WebSocket port
        <input id="port" value="3679" inputmode="numeric" />
      </label>

      <label>
        Session token (only if the server was started with --token)
        <input id="token" placeholder="Optional" />
      </label>

      <div class="row">
        <button id="connect">Connect</button>
        <button id="disconnect" class="secondary">Disconnect</button>
      </div>

      <div id="status" class="status">Not connected.</div>
      <div id="log" class="log"></div>
      <div class="hint">Default bridge URL: <code>ws://127.0.0.1:3679/ws</code></div>
    </div>

    <script>
      const dotEl = document.getElementById('dot');
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const portEl = document.getElementById('port');
      const tokenEl = document.getElementById('token');

      let ws = null;
      let state = 'idle'; // idle | connecting | auth-pending | connected
      let reconnectTimer = null;
      let reconnectEnabled = false;
      let commandCount = 0;
      let inFlight = null;

      function addLog(text) {
        const line = document.createElement('div');
        const time = new Date().toLocaleTimeString();
        line.textContent = `[${time}] ${text}`;
        logEl.prepend(line);
        while (logEl.children.length > 60) logEl.removeChild(logEl.lastChild);
      }

      function render() {
        dotEl.className = 'dot' + (state === 'connected' ? ' connected' : state === 'idle' ? '' : state === 'error' ? ' error' : ' connecting');
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function buildUrl() {
        const port = String(portEl.value || '3679').trim();
        return `ws://127.0.0.1:${port}/ws?client=pixso-plugin`;
      }

      function scheduleReconnect() {
        if (!reconnectEnabled || reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, 1500);
      }

      function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        reconnectEnabled = true;
        state = 'connecting';
        render();
        const url = buildUrl();
        setStatus(`Connecting to ${url} ...`);

        let socket;
        try {
          socket = new WebSocket(url);
        } catch (error) {
          state = 'error';
          render();
          setStatus(`Failed to open WebSocket: ${error.message}`);
          scheduleReconnect();
          return;
        }
        ws = socket;

        socket.onopen = () => {
          const token = String(tokenEl.value || '').trim();
          if (token) {
            state = 'auth-pending';
            render();
            setStatus('Connected. Authenticating...');
            socket.send(JSON.stringify({ type: 'auth', token }));
          } else {
            finishConnect();
          }
        };

        socket.onmessage = event => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch (error) {
            addLog(`Unparseable message from bridge: ${error.message}`);
            return;
          }

          if (message && message.type === 'auth-ok') {
            finishConnect();
            return;
          }

          if (!message || typeof message.id !== 'string') return;

          if (inFlight) {
            socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify({
              id: message.id,
              ok: false,
              error: `Pixso plugin is still executing ${inFlight.command}. Wait for it to finish before sending another command.`
            }));
            addLog(`Rejected overlapping command ${message.command} while executing ${inFlight.command}`);
            return;
          }

          commandCount += 1;
          inFlight = { id: message.id, command: message.command, startedAt: Date.now() };
          setStatus(`Connected. Executing #${commandCount}: ${message.command}`);
          addLog(`Command received: ${message.command}`);
          parent.postMessage({ pluginMessage: { type: 'mcp-command', message } }, '*');
        };

        socket.onclose = event => {
          const wasState = state;
          ws = null;
          inFlight = null;
          if (event.code === 4401) {
            state = 'error';
            reconnectEnabled = false;
            render();
            setStatus('Authentication failed: token rejected by the bridge. Fix the token and press Connect.');
            addLog(`Closed by bridge: ${event.reason || 'invalid token'}`);
            return;
          }
          if (event.code === 4408) {
            state = 'error';
            reconnectEnabled = false;
            render();
            setStatus('Authentication timeout: the bridge expects {type:"auth", token} as the first message. Press Connect to retry.');
            return;
          }
          state = 'idle';
          render();
          setStatus(`Disconnected (${event.code}${event.reason ? ': ' + event.reason : ''}). Retrying while this window stays open...`);
          if (wasState !== 'idle') addLog(`Connection closed: ${event.code} ${event.reason || ''}`.trim());
          scheduleReconnect();
        };

        socket.onerror = () => {
          addLog('WebSocket error. Is the local bridge running (npm start)?');
        };
      }

      function finishConnect() {
        state = 'connected';
        render();
        setStatus('Connected to the local bridge. Waiting for MCP commands...');
        addLog('Bridge connection established');
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'hello',
            plugin: { name: 'My Pixso MCP', uiConnectedAt: new Date().toISOString() }
          }));
        }
      }

      function disconnect() {
        reconnectEnabled = false;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (ws) ws.close(1000, 'User disconnected');
        ws = null;
        inFlight = null;
        state = 'idle';
        render();
        setStatus('Disconnected.');
      }

      window.onmessage = event => {
        const pluginMessage = event.data && event.data.pluginMessage;
        if (!pluginMessage || pluginMessage.type !== 'mcp-response') return;
        if (!inFlight || !pluginMessage.response || pluginMessage.response.id !== inFlight.id) return;
        const command = inFlight.command;
        const elapsed = Date.now() - inFlight.startedAt;
        inFlight = null;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          setStatus(`Command ${command} finished, but the bridge connection is gone.`);
          return;
        }
        ws.send(JSON.stringify(pluginMessage.response));
        const ok = Boolean(pluginMessage.response.ok);
        setStatus(`Connected. Last command ${command} ${ok ? 'completed' : 'failed'} in ${elapsed}ms.`);
        addLog(`Command ${command} -> ${ok ? 'ok' : 'error'} (${elapsed}ms)`);
        if (state !== 'connected') {
          state = 'connected';
          render();
        }
      };

      document.getElementById('connect').onclick = connect;
      document.getElementById('disconnect').onclick = disconnect;
      connect();
    </script>
  </body>
</html>
