<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixso Advanced MCP</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111827; color: #f9fafb; }
      .wrap { padding: 14px; display: grid; gap: 10px; }
      h1 { margin: 0 0 4px; font-size: 15px; }
      label { display: grid; gap: 4px; color: #d1d5db; }
      input { border: 1px solid #374151; background: #030712; color: #f9fafb; border-radius: 8px; padding: 8px; }
      button { border: 0; border-radius: 8px; padding: 9px 10px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
      button.secondary { background: #374151; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      .status { padding: 8px; border-radius: 8px; background: #1f2937; white-space: pre-wrap; min-height: 40px; }
      .ok { color: #86efac; }
      .bad { color: #fca5a5; }
      .hint { color: #9ca3af; font-size: 12px; }
      code { color: #bfdbfe; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <h1>Pixso Advanced MCP</h1>
        <div class="hint">Keep this window open while your coding agent calls MCP tools.</div>
      </div>

      <label>
        WebSocket port
        <input id="port" value="3669" inputmode="numeric" />
      </label>

      <label>
        Optional session token
        <input id="token" placeholder="Leave blank unless server was started with --token" />
      </label>

      <div class="row">
        <button id="connect">Connect</button>
        <button id="disconnect" class="secondary">Disconnect</button>
      </div>

      <div id="status" class="status bad">Connecting to the local bridge...</div>
      <div class="hint">Recommended first run: start the bridge with <code>npm start</code>, then keep this plugin open.</div>
      <div class="hint">Default URL: <code>ws://127.0.0.1:3669/ws</code></div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const portEl = document.getElementById('port');
      const tokenEl = document.getElementById('token');
      const connectButton = document.getElementById('connect');
      const disconnectButton = document.getElementById('disconnect');
      let ws = null;
      let reconnectTimer = null;
      let reconnectEnabled = true;
      let commandCount = 0;
      let commandInFlight = null;

      function setStatus(text, ok) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + (ok ? 'ok' : 'bad');
      }

      function redactUrlForStatus(url) {
        try {
          const parsed = new URL(url);
          if (parsed.searchParams.has('token')) parsed.searchParams.set('token', '***');
          return parsed.toString();
        } catch {
          return url;
        }
      }

      function buildUrl() {
        const port = String(portEl.value || '3669').trim();
        const token = String(tokenEl.value || '').trim();
        const params = new URLSearchParams({ client: 'pixso-plugin' });
        if (token) params.set('token', token);
        return `ws://127.0.0.1:${port}/ws?${params.toString()}`;
      }

      function scheduleReconnect() {
        if (!reconnectEnabled || reconnectTimer) return;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, 1200);
      }

      function connect() {
        reconnectEnabled = true;
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        const url = buildUrl();
        setStatus(`Connecting to ${redactUrlForStatus(url)} ...`, false);
        ws = new WebSocket(url);

        ws.onopen = () => {
          setStatus('Connected to the local bridge. Waiting for MCP commands...', true);
          ws.send(JSON.stringify({ type: 'hello', plugin: { name: 'Pixso Advanced MCP', uiConnectedAt: new Date().toISOString() } }));
        };

        ws.onclose = event => {
          const closeReason = String(event.reason || '');
          const duplicateSessionReasons = [
            'Replacing active Pixso plugin session',
            'Another Pixso plugin session is already connected'
          ];
          if (closeReason.includes('Pixso plugin stopped responding')) {
            reconnectEnabled = false;
            ws = null;
            setStatus('The last Pixso command timed out. Close and reopen this plugin window before reconnecting; the bridge rejected further commands to prevent a hang loop.', false);
            return;
          }
          if (duplicateSessionReasons.some(reason => closeReason.includes(reason))) {
            reconnectEnabled = false;
            ws = null;
            setStatus('Disconnected because another Pixso Advanced MCP plugin window connected. Close duplicate plugin windows, then press Connect in the one window you want to use.', false);
            return;
          }
          setStatus('Disconnected from the local bridge. Retrying while this window stays open...', false);
          ws = null;
          scheduleReconnect();
        };

        ws.onerror = () => {
          setStatus('Connection error. Start the local bridge with npm start, then reconnect or wait for retry.', false);
        };

        ws.onmessage = event => {
          try {
            const message = JSON.parse(event.data);
            if (!message || typeof message.id !== 'string') return;
            if (commandInFlight) {
              ws.send(JSON.stringify({
                id: message.id,
                ok: false,
                error: `Pixso plugin is still executing ${commandInFlight.command}. Wait for it to finish before sending another command.`
              }));
              setStatus(`Connected. Still executing ${commandInFlight.command}; rejected overlapping ${message.command}.`, false);
              return;
            }
            commandCount += 1;
            commandInFlight = { id: message.id, command: message.command, startedAt: Date.now() };
            setStatus(`Connected. Executing command #${commandCount}: ${message.command}`, true);
            parent.postMessage({ pluginMessage: { type: 'mcp-command', message } }, '*');
          } catch (error) {
            setStatus(`Failed to parse MCP command: ${error.message}`, false);
          }
        };
      }

      function disconnect() {
        reconnectEnabled = false;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (ws) ws.close();
        ws = null;
        setStatus('Disconnected', false);
      }

      window.onmessage = event => {
        const pluginMessage = event.data && event.data.pluginMessage;
        if (!pluginMessage || pluginMessage.type !== 'mcp-response') return;
        if (!commandInFlight || pluginMessage.response.id !== commandInFlight.id) return;
        commandInFlight = null;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          setStatus('Command finished, but the local bridge is no longer connected.', false);
          return;
        }
        ws.send(JSON.stringify(pluginMessage.response));
        setStatus(`Connected. Last MCP command completed: ${pluginMessage.response.ok ? 'ok' : 'error'}`, pluginMessage.response.ok);
      };

      connectButton.onclick = connect;
      disconnectButton.onclick = disconnect;
      connect();
    </script>
  </body>
</html>
