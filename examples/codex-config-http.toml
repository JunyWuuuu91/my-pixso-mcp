# Recommended first-run mode: start the local bridge with `npm start`, then use this config.
[mcp_servers.pixso_advanced]
url = "http://127.0.0.1:3668/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
enabled_tools = [
  "health",
  "get_file_info",
  "list_pages",
  "list_frames",
  "search_nodes",
  "get_node_tree",
  "inspect_node",
  "get_selection_context",
  "get_design_tokens",
  "get_styles",
  "get_components",
  "get_export_preview",
  "get_screenshot",
  "export_asset",
  "find_related_frames",
  "get_coding_context",
  "get_css_context"
]
